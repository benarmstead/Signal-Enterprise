name: Android CI

on:
  pull_request:
  push:
    branches:
    - 'master'
    - 'main'
    - '8.**'
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # gh api repos/actions/checkout/commits/v6 --jq '.sha'
      with:
          submodules: true
          lfs: true

    - name: set up JDK 21
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
      # gh api repos/actions/setup-java/commits/v5 --jq '.sha'
      with:
        distribution: temurin
        java-version: 21

    # The committed gradle.properties targets upstream's 8-core/32GB CI runners with a private
    # Gradle remote build cache (-Xmx12g daemon). On a free 16GB ubuntu-latest runner building from
    # scratch, that heap OOM-kills the runner. Override the daemon memory in the Gradle user home
    # (higher precedence than the project file, so upstream merges never conflict here) to fit a
    # hosted runner while leaving Kotlin enough heap to compile the app.
    - name: Constrain Gradle memory for hosted runner
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dcom.android.tools.r8.threadCount=1
        kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
        org.gradle.workers.max=3
        EOF

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # gh api repos/gradle/actions/commits/v6 --jq '.sha'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # gh api repos/gradle/actions/commits/v6 --jq '.sha'
      with:
        # Only 8.** branch builds write to the cache; everything else (PRs, etc.) reads only.
        cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/8.') }}
        # Required to persist the Gradle configuration cache across runs.
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    # Verify what matters for this fork and is reliable on a free runner: the app compiles, passes
    # ktlint, and assembles the same variant the release pipeline ships (assemblePlayProdDebug uses
    # the auto-generated debug keystore, so no signing secrets are needed here). Upstream's full
    # `ci`/`qa` tasks additionally run the unit-test + instrumentation-compile suite, which is too
    # slow / memory-heavy to run from a cold cache on a free runner; run those locally via
    # `./gradlew qa` before cutting a release.
    - name: Build with Gradle
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
      run: ./gradlew assemblePlayProdDebug ktlintCheck

    - name: Archive reports for failed build
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      # gh api repos/actions/upload-artifact/commits/v7 --jq '.sha'
      with:
        name: reports
        path: '*/build/reports'
