name: Build and Release

on:
  push:
    branches:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2026 or v8.18.1). Defaults to the branch name."
        required: false
        type: string

permissions:
  contents: write # to create a GitHub Release and upload assets

# Keep in sync with `ndk` in gradle/libs.versions.toml. Without this NDK installed, AGP cannot
# strip debug symbols from the prebuilt native libraries (libsignal_jni.so, libringrtc_rffi.so),
# which then ship unstripped and roughly double the release APK size.
env:
  NDK_VERSION: '28.0.13004108'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Required so AGP strips debug symbols from the prebuilt native libs during the release build.
      - name: Install NDK
        run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The committed gradle.properties targets upstream's 32GB CI runners (-Xmx12g daemon). On a
      # free 16GB runner the release build (with R8 minification) OOM-kills the runner. Override the
      # daemon heap in the Gradle user home (higher precedence than the project file, so upstream
      # merges never conflict here) to fit a hosted runner.
      - name: Constrain Gradle memory for hosted runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dcom.android.tools.r8.threadCount=1
          kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          org.gradle.workers.max=3
          EOF

      - name: Resolve release tag
        id: get-version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/heads/}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing release: ${VERSION}"

      - name: Build with Gradle
        run: ./gradlew assemblePlayProdRelease

      - name: Sign APKs
        env:
          # To generate the keystore secret locally:
          #   keytool -genkey -v -keystore apksign.keystore -alias apksign -keyalg RSA -keysize 4096
          #   base64 -i apksign.keystore | pbcopy   # store as the KEYSTORE_BASE64 repo secret
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign the release APKs."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > apksign.keystore

          # Use the newest installed build-tools rather than hardcoding a version
          # (the merged upstream may require a newer SDK than any pinned value).
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          echo "Using apksigner: ${APKSIGNER}"

          shopt -s nullglob
          for apk in app/build/outputs/apk/playProd/release/*-unsigned-*.apk; do
            out="${apk/-unsigned-/-signed-}"
            "${APKSIGNER}" sign \
              --ks apksign.keystore \
              --ks-pass env:KEYSTORE_PASS \
              --out "${out}" "${apk}"
            sha256sum "${out}"
          done
          rm -f apksign.keystore

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/playProd/release
          sha256sum *-signed-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.VERSION }}
          name: "Signal-Enterprise ${{ steps.get-version.outputs.VERSION }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/playProd/release/*-signed-*.apk
            app/build/outputs/apk/playProd/release/SHA256SUMS.txt
